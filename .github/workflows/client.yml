name: client

# Path filters cannot use expressions, so they name the folder too.
on:
  push:
    branches: [main]
    paths: ["client/**", ".github/workflows/client.yml"]
  pull_request:
    paths: ["client/**", ".github/workflows/client.yml"]

env:
  APP_DIR: client

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.APP_DIR }}
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: ${{ env.APP_DIR }}/package.json

      - run: bun install --frozen-lockfile

      - run: bun run check
