openapi: 3.0.3
info:
  title: Mirror API
  version: 0.1.0
  description: >-
    The Mirror API. This file is the single source of truth for the API
    contract; the server generates its handlers from it and clients generate
    their types from it.
servers:
  - url: /
paths:
  /v1/healthz:
    get:
      operationId: getHealth
      summary: Report that the server is up
      tags: [system]
      responses:
        "200":
          description: The server is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /v1/openapi.yaml:
    get:
      operationId: getOpenAPISpec
      summary: Return this API contract
      tags: [system]
      responses:
        "200":
          description: The OpenAPI contract.
          content:
            application/yaml:
              schema:
                type: string
components:
  schemas:
    Health:
      type: object
      required: [status, version, time]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: Build version, set at build time; "dev" when unset.
          example: dev
        time:
          type: string
          format: date-time
          description: Server time in RFC 3339.
